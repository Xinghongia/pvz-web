name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build both games
        run: pnpm build

      - name: Trim enhanced texture pack (Cloudflare caps single file at 25MiB)
        run: |
          echo "== before"; du -sh dist; find dist -type f | wc -l
          rm -rf dist/pvz2/assets/quality/enhanced
          echo "== files over 25M (should be empty):"; find dist -type f -size +25M -print || true
          echo "== after"; du -sh dist; find dist -type f | wc -l

      - name: Add cache headers
        run: |
          printf '/sw.js\n  Cache-Control: no-cache\n' > dist/_headers

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name=pvz-web --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
